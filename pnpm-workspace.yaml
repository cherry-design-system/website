allowBuilds:
  sharp: false
  unrs-resolver: false
  core-js: false

# Supply-chain guard (same as the Vercel build): skip packages published in the
# last 24 hours. Our own cherry packages are exempt so a release can ship the
# same day.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@cherry-design-system/*"
